[project]
name = "home-assistant-emby-plus"
version = "0.1.0"
description = "Emby Plus for Home Assistant: Emby players configured in the UI, reconnecting when the server comes back."
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true
